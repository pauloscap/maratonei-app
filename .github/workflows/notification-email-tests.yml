name: Notification email tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/notificacoes-email

permissions:
  contents: read

jobs:
  email-unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maratonei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maratonei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run isolated email tests
        run: npm run test:email
      - name: Validate migration and trigger in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d maratonei_test -v ON_ERROR_STOP=1 -f supabase/tests/notification_email_migration_test.sql
