name: Notification email tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/notificacoes-email

permissions:
  contents: read

jobs:
  email-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run isolated email tests
        run: npm run test:email
